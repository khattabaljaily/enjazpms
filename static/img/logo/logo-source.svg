<svg xmlns="http://www.w3.org/2000/svg" viewBox="49 29 106 160">
  <!-- Cup (goblet), mirror-symmetric around x=100 -->
  <path d="M 60 84
           C 60 116, 78 138, 100 138
           C 122 138, 140 116, 140 84"
        fill="none" stroke="COLOR" stroke-width="11" stroke-linecap="round"/>
  <!-- Stem + foot -->
  <g fill="COLOR">
    <rect x="95" y="136" width="10" height="26" rx="2"/>
    <path d="M 80 162 L 120 162 L 130 176 L 70 176 Z"/>
  </g>

  <!-- Snake body: coils around the stem and rises along the cup toward the head -->
  <path d="M 100 178
           C 70 178, 58 160, 76 148
           C 92 138, 106 144, 104 124
           C 102 106, 76 108, 76 90
           C 76 74, 92 65, 106 68"
        fill="none" stroke="COLOR" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Head, tilted oval tangent to the neck -->
  <g transform="rotate(-28 118 62)">
    <ellipse cx="118" cy="62" rx="17" ry="12" fill="COLOR"/>
  </g>
  <circle cx="126" cy="55" r="3" fill="#ffffff"/>
  <path d="M 138 48 L 148 40 M 138 48 L 145 36" stroke="COLOR" stroke-width="3" stroke-linecap="round"/>
</svg>
