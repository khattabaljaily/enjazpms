{% load static %}

<!-- AI Floating Button -->
<!-- Shared robot face (used by the floating button and the chat header) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
        <linearGradient id="aibShell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#fdf1e3"/><stop offset="1" stop-color="#f3d3ad"/></linearGradient>
        <linearGradient id="aibScreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2203"/><stop offset="1" stop-color="#2a1100"/></linearGradient>
        <linearGradient id="aibBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffa63d"/><stop offset="1" stop-color="#e8680a"/></linearGradient>
        <filter id="aibGlowF" x="-40%" y="-80%" width="180%" height="260%"><feDropShadow dx="0" dy="0" stdDeviation="1.1" flood-color="#7df9ff" flood-opacity=".9"/></filter>
        <linearGradient id="aibPod" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#f07a12"/></linearGradient>
        <radialGradient id="aibEye" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#fffbe0"/><stop offset=".6" stop-color="#ffd36b"/><stop offset="1" stop-color="#ffb11f"/></radialGradient>
        <filter id="aibBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
        <radialGradient id="aibGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff7c2"/><stop offset="1" stop-color="#ffb11f"/></radialGradient>
        <symbol id="ai-bot-face" viewBox="0 0 48 48">
            <ellipse cx="24" cy="46.5" rx="10" ry="1.3" fill="#000" opacity=".2"/>
            <path d="M14 38 q10 -4 20 0 l-1.5 6.5 q-8.5 3 -17 0z" fill="url(#aibBody)" stroke="#fff" stroke-width="1"/>
            <circle cx="24" cy="41.5" r="1.7" fill="url(#aibGlow)"/>
            <line x1="24" y1="7" x2="24" y2="3" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
            <circle class="ai-bot__antenna" cx="24" cy="2.8" r="2.6" fill="url(#aibGlow)" stroke="#fff" stroke-width="1"/>
            <rect x="2.5" y="17" width="6" height="11" rx="3" fill="#2b1608" stroke="#fff" stroke-width="1"/>
            <rect x="39.5" y="17" width="6" height="11" rx="3" fill="#2b1608" stroke="#fff" stroke-width="1"/>
            <rect x="6.5" y="6.5" width="35" height="31" rx="14" fill="url(#aibShell)" stroke="#fff" stroke-width="1.2"/>
            <rect x="10" y="12" width="28" height="19" rx="9.5" fill="url(#aibScreen)"/>
            <path d="M14 15.5 q7 -2.5 14 -.5" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" opacity=".28"/>
            <g class="ai-bot__eyes" fill="none" stroke="#7df9ff" stroke-width="2.6" stroke-linecap="round">
                <path d="M15.5 22.5 q3 -5 6 0" filter="url(#aibGlowF)"/>
                <path d="M26.5 22.5 q3 -5 6 0" filter="url(#aibGlowF)"/>
            </g>
            <path d="M20 26 q4 3.5 8 0" fill="none" stroke="#7df9ff" stroke-width="1.9" stroke-linecap="round"/>
            <ellipse cx="13.5" cy="26.5" rx="2.2" ry="1.3" fill="#ff7aa8" opacity=".55"/>
            <ellipse cx="34.5" cy="26.5" rx="2.2" ry="1.3" fill="#ff7aa8" opacity=".55"/>
        </symbol>
    </defs>
</svg>

<!-- AI Floating Button -->
<button id="ai-fab" class="ai-fab" title="المساعد الذكي" aria-label="فتح المساعد الذكي">
    <svg class="ai-fab__bot" viewBox="0 0 70 58" width="62" height="51" aria-hidden="true">
        <g class="ai-bot__head"><use href="#ai-bot-face" x="9" y="0" width="52" height="52"/></g>
        <g class="ai-bot__arm">
            <path d="M45 43 L58 33" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none"/>
            <path d="M45 43 L58 33" stroke="#f07a12" stroke-width="3.6" stroke-linecap="round" fill="none"/>
            <circle cx="59" cy="32" r="4" fill="#ffd36b" stroke="#fff" stroke-width="1.3"/>
            <circle cx="46" cy="43" r="2.6" fill="#ffa63d" stroke="#fff" stroke-width="1"/>
        </g>
    </svg>
    <span class="ai-fab__pulse"></span>
</button>

<!-- AI Chat Panel -->
<div id="ai-panel" class="ai-panel" role="dialog" aria-label="المساعد الذكي" aria-hidden="true">

    <!-- Header -->
    <div class="ai-panel__header">
        <div class="ai-panel__header-info">
            <div class="ai-panel__avatar">
                <svg class="ai-panel__bot" viewBox="0 0 48 48" width="34" height="34" aria-hidden="true"><use href="#ai-bot-face"/></svg>
            </div>
            <div>
                <div class="ai-panel__title">المساعد الذكي</div>
            </div>
        </div>
        <div class="ai-panel__header-actions">
            <button id="ai-insights-btn" class="ai-header-btn" title="رؤى يومية">
                <i class="fa-solid fa-chart-line"></i>
            </button>
            <button id="ai-clear-btn" class="ai-header-btn" title="محادثة جديدة">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
            <button id="ai-close-btn" class="ai-header-btn" title="إغلاق">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
    </div>

    <!-- Messages -->
    <div id="ai-messages" class="ai-panel__messages">
        <div class="ai-msg ai-msg--assistant">
            <div class="ai-msg__bubble">
                مرحباً! أنا مساعدك الذكي. يمكنني تحليل بيانات أعمالك والإجابة على أسئلتك.
                <br><br>جرّب أن تسألني:
            </div>
        </div>
        <div class="ai-suggestions">
            {% if request.user.is_tenant_admin and current_tenant.version_type == 'multi_branch' %}
            <button class="ai-suggestion" data-q="قارن أداء الفروع هذا الشهر">مقارنة أداء الفروع</button>
            <button class="ai-suggestion" data-q="أي الفروع مبيعاته أقل وتحتاج متابعة؟">فرع يحتاج متابعة</button>
            <button class="ai-suggestion" data-q="أي الفروع لديه أصناف تحت الحد الأدنى؟">مخزون الفروع</button>
            <button class="ai-suggestion" data-q="هل يوجد فرع بلا مدير؟">فروع بلا مدير</button>
            {% else %}
            <button class="ai-suggestion" data-q="ما هي أكثر المنتجات مبيعاً هذا الشهر؟">أكثر المنتجات مبيعاً</button>
            <button class="ai-suggestion" data-q="هل هناك منتجات تحتاج إعادة طلب قريباً؟">منتجات تحتاج طلب</button>
            <button class="ai-suggestion" data-q="كيف حال المبيعات هذا الأسبوع؟">أداء هذا الأسبوع</button>
            <button class="ai-suggestion" data-q="من أكثر العملاء مديونية؟">أعلى مديونيات العملاء</button>
            {% endif %}
        </div>
    </div>

    <!-- Input -->
    <div class="ai-panel__input-area">
        <textarea
            id="ai-input"
            class="ai-panel__input"
            placeholder="اكتب سؤالك هنا..."
            rows="1"
            maxlength="500"
            dir="rtl"
        ></textarea>
        <button id="ai-send-btn" class="ai-send-btn" title="إرسال">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>
</div>

<!-- Overlay -->
<div id="ai-overlay" class="ai-overlay"></div>


<style>
/* ─────────────────────────────────────────────
   AI Widget Styles
   ───────────────────────────────────────────── */

:root {
    --ai-primary: #c9840f;
    --ai-primary-dark: #a8660c;
    --ai-surface: var(--surface, #ffffff);
    --ai-surface-alt: var(--surface-alt, #f8fafc);
    --ai-border: var(--border-color, #e2e8f0);
    --ai-text: var(--text-primary, #1e293b);
    --ai-text-muted: var(--text-muted, #64748b);
    --ai-shadow: 0 20px 60px rgba(0,0,0,.18);
}

/* Floating Action Button */
.ai-fab {
    position: fixed;
    bottom: 28px;
    left: 28px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--ai-primary), var(--ai-primary-dark));
    border: none;
    color: #fff;
    font-size: 1.35rem;
    cursor: pointer;
    z-index: 1050;
    box-shadow: 0 4px 20px rgba(246,168,33,.45);
    transition: transform .2s, box-shadow .2s;
    display: flex;
    align-items: center;
    justify-content: center;
}
.ai-fab:hover { box-shadow: 0 6px 28px rgba(246,168,33,.55); }

.ai-fab { overflow: visible; }
.ai-fab__bot { position: absolute; z-index: 2; overflow: visible; left: 50%; bottom: 2px; margin-left: -31px; filter: drop-shadow(0 4px 6px rgba(120,60,0,.35)); pointer-events: none; animation: ai-fab-call 4s ease-in-out infinite; }
.ai-fab:hover .ai-fab__bot { animation-play-state: paused; }
.ai-bot__arm { transform-origin: 45px 43px; animation: ai-bot-wave 0.9s ease-in-out infinite; }
@keyframes ai-bot-wave { 0%,100% { transform: rotate(-14deg); } 50% { transform: rotate(20deg); } }
@keyframes ai-fab-call {
    0%, 60%, 100% { transform: translateY(0); }
    66% { transform: translateY(-14px); }
    72% { transform: translateY(0); }
    78% { transform: translateY(-9px); }
    84% { transform: translateY(0); }
}
.ai-bot__head { transform-box: fill-box; transform-origin: 50% 90%; animation: ai-bot-greet 2.5s ease-in-out infinite; }
.ai-bot__antenna { animation: ai-bot-antenna 1.2s ease-in-out infinite; }
.ai-bot__eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: ai-bot-blink 5s infinite; }
.ai-fab:hover .ai-bot__head { animation: ai-bot-greet 1.2s ease-in-out infinite; }
@keyframes ai-bot-greet {
    0%, 55%, 100% { transform: rotate(0) translateY(0); }
    62% { transform: rotate(-12deg) translateY(-2px); }
    70% { transform: rotate(10deg) translateY(-2px); }
    78% { transform: rotate(-8deg) translateY(-1px); }
    86% { transform: rotate(5deg); }
}
@keyframes ai-bot-antenna { 0%,100% { transform: translateY(0); } 50% { transform: translateY(1.5px); } }
@keyframes ai-bot-blink { 0%, 90%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.1); } }
@media (prefers-reduced-motion: reduce) { .ai-fab__bot, .ai-bot__head, .ai-bot__antenna, .ai-bot__eyes, .ai-bot__arm { animation: none !important; } }

.ai-fab__pulse {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--ai-primary);
    opacity: .4;
    animation: ai-pulse 2.2s ease-out infinite;
    pointer-events: none;
}
@keyframes ai-pulse {
    0%   { transform: scale(1);   opacity: .4; }
    70%  { transform: scale(1.55); opacity: 0;  }
    100% { transform: scale(1);   opacity: 0;  }
}

/* Panel */
.ai-panel {
    position: fixed;
    bottom: 96px;
    left: 20px;
    width: 380px;
    max-height: 580px;
    display: flex;
    flex-direction: column;
    background: var(--ai-surface);
    border: 1px solid var(--ai-border);
    border-radius: 18px;
    box-shadow: var(--ai-shadow);
    z-index: 1049;
    overflow: hidden;
    transform: translateY(20px) scale(.96);
    opacity: 0;
    pointer-events: none;
    transition: transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s;
    direction: rtl;
}
.ai-panel.open {
    transform: translateY(0) scale(1);
    opacity: 1;
    pointer-events: all;
}

/* Header */
.ai-panel__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: linear-gradient(135deg, var(--ai-primary), var(--ai-primary-dark));
    color: #fff;
    flex-shrink: 0;
}
.ai-panel__header-info { display: flex; align-items: center; gap: 10px; }
.ai-panel__avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255,255,255,.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
}
.ai-panel__bot { overflow: visible; filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
.ai-panel__title { font-weight: 700; font-size: .95rem; }
.ai-panel__subtitle { font-size: .72rem; opacity: .8; }
.ai-panel__header-actions { display: flex; gap: 4px; }
.ai-header-btn {
    background: rgba(255,255,255,.15);
    border: none;
    color: #fff;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    cursor: pointer;
    font-size: .85rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s;
}
.ai-header-btn:hover { background: rgba(255,255,255,.28); }

/* Messages */
.ai-panel__messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--ai-surface-alt);
    scroll-behavior: smooth;
}
.ai-panel__messages::-webkit-scrollbar { width: 4px; }
.ai-panel__messages::-webkit-scrollbar-thumb { background: var(--ai-border); border-radius: 2px; }

/* Message bubbles */
.ai-msg { display: flex; max-width: 90%; }
.ai-msg--user  { align-self: flex-start; }
.ai-msg--assistant { align-self: flex-end; }

.ai-msg__bubble {
    padding: 10px 14px;
    border-radius: 16px;
    font-size: .875rem;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
}
.ai-msg--user .ai-msg__bubble {
    background: var(--ai-primary);
    color: #fff;
    border-bottom-right-radius: 4px;
}
.ai-msg--assistant .ai-msg__bubble {
    background: var(--ai-surface);
    color: var(--ai-text);
    border: 1px solid var(--ai-border);
    border-bottom-left-radius: 4px;
}

/* Suggestions */
.ai-suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-self: flex-end;
}
.ai-suggestion {
    background: var(--ai-surface);
    border: 1px solid var(--ai-primary);
    color: var(--ai-primary);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: .78rem;
    cursor: pointer;
    transition: background .15s, color .15s;
}
.ai-suggestion:hover { background: var(--ai-primary); color: #fff; }

/* Typing bubble — appears inside message thread as an assistant bubble */
.ai-typing-bubble {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 12px 16px;
    min-height: 42px;
    min-width: 62px;
}

.ai-typing-bubble span {
    display: block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ai-primary);
    opacity: 0.45;
    animation: ai-typing-dot 1.4s infinite ease-in-out;
}

.ai-typing-bubble span:nth-child(2) { animation-delay: .2s; }
.ai-typing-bubble span:nth-child(3) { animation-delay: .4s; }

@keyframes ai-typing-dot {
    0%, 60%, 100% { transform: translateY(0);    opacity: 0.45; }
    30%            { transform: translateY(-7px); opacity: 1;    }
}

/* Input */
.ai-panel__input-area {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 10px 14px;
    border-top: 1px solid var(--ai-border);
    background: var(--ai-surface);
    flex-shrink: 0;
}
.ai-panel__input {
    flex: 1;
    border: 1px solid var(--ai-border);
    border-radius: 12px;
    padding: 9px 13px;
    font-size: .875rem;
    resize: none;
    font-family: inherit;
    color: var(--ai-text);
    background: var(--ai-surface-alt);
    outline: none;
    transition: border-color .2s;
    max-height: 100px;
    direction: rtl;
}
.ai-panel__input:focus { border-color: var(--ai-primary); }

.ai-send-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--ai-primary);
    border: none;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .9rem;
    transition: background .15s, transform .1s;
    flex-shrink: 0;
}
.ai-send-btn:hover { background: var(--ai-primary-dark); }
.ai-send-btn:active { transform: scale(.92); }
.ai-send-btn:disabled { background: var(--ai-border); cursor: not-allowed; }

/* Overlay (mobile) */
.ai-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.3);
    z-index: 1048;
}
.ai-overlay.show { display: block; }

/* Responsive */
@media (max-width: 480px) {
    .ai-panel {
        bottom: 0;
        left: 0;
        width: 100%;
        max-height: 75vh;
        border-radius: 18px 18px 0 0;
    }
    .ai-fab { bottom: 18px; left: 18px; }
}

/* Dark mode */
[data-theme="dark"] {
    --ai-surface: #1e1e2e;
    --ai-surface-alt: #181825;
    --ai-border: #313244;
    --ai-text: #cdd6f4;
    --ai-text-muted: #a6adc8;
}
</style>


<script>
(function () {
    const fab         = document.getElementById('ai-fab');
    const panel       = document.getElementById('ai-panel');
    const overlay     = document.getElementById('ai-overlay');
    const messages    = document.getElementById('ai-messages');
    const input       = document.getElementById('ai-input');
    const sendBtn     = document.getElementById('ai-send-btn');
    const closeBtn    = document.getElementById('ai-close-btn');
    const clearBtn    = document.getElementById('ai-clear-btn');
    const insightsBtn = document.getElementById('ai-insights-btn');

    let history     = [];
    let isOpen      = false;
    let busy        = false;
    let _typingEl   = null;
    let _openLogged = false;    // track only first open per page load

    // ── Open / Close ─────────────────────────────────────────
    function openPanel() {
        isOpen = true;
        panel.classList.add('open');
        panel.setAttribute('aria-hidden', 'false');
        overlay.classList.add('show');
        input.focus();
        if (!_openLogged) {
            _openLogged = true;
            $.post({ url: '{% url "ai:track_open" %}', global: false,
                     contentType: 'application/json',
                     data: JSON.stringify({ page: window.location.pathname }) });
        }
    }
    function closePanel() {
        isOpen = false;
        panel.classList.remove('open');
        panel.setAttribute('aria-hidden', 'true');
        overlay.classList.remove('show');
    }

    fab.addEventListener('click', () => isOpen ? closePanel() : openPanel());
    closeBtn.addEventListener('click', closePanel);
    overlay.addEventListener('click', closePanel);

    // ── Clear chat ───────────────────────────────────────────
    clearBtn.addEventListener('click', () => {
        history = [];
        messages.innerHTML = `
            <div class="ai-msg ai-msg--assistant">
                <div class="ai-msg__bubble">محادثة جديدة — كيف يمكنني مساعدتك؟</div>
            </div>`;
    });

    // ── Auto-resize textarea ─────────────────────────────────
    input.addEventListener('input', () => {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 100) + 'px';
    });

    // ── Quick suggestions ────────────────────────────────────
    document.querySelectorAll('.ai-suggestion').forEach(btn => {
        btn.addEventListener('click', () => {
            sendMessage(btn.dataset.q);
            // Remove suggestion chips after first use
            const chips = document.querySelector('.ai-suggestions');
            if (chips) chips.remove();
        });
    });

    // ── Send on Enter (Shift+Enter = newline) ────────────────
    input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            if (!busy) sendMessage(input.value.trim());
        }
    });
    sendBtn.addEventListener('click', () => {
        if (!busy) sendMessage(input.value.trim());
    });

    // ── Daily Insights button ────────────────────────────────
    insightsBtn.addEventListener('click', () => {
        if (busy) return;
        setBusy(true);
        $.get({ url: '{% url "ai:insights" %}', global: false })
            .done(data => appendMsg('assistant', data.insights))
            .fail(() => appendMsg('assistant', 'تعذّر تحميل الرؤى اليومية.'))
            .always(() => setBusy(false));
    });

    // ── Core send logic ──────────────────────────────────────
    function sendMessage(text) {
        if (!text || busy) return;
        input.value = '';
        input.style.height = 'auto';

        appendMsg('user', text);
        setBusy(true);

        $.ajax({
            url:    '{% url "ai:chat" %}',
            type:   'POST',
            global: false,          /* suppress the page-level loading spinner */
            contentType: 'application/json',
            data: JSON.stringify({ message: text, history: history }),
        })
        .done(data => {
            if (data.error) {
                appendMsg('assistant', `⚠️ خطأ: ${data.error}`);
                return;
            }
            const reply = data.reply || 'لا توجد استجابة.';
            appendMsg('assistant', reply);
            history.push({ role: 'user', content: text });
            history.push({ role: 'assistant', content: reply });
        })
        .fail((xhr) => {
            let msg;
            if (xhr.status === 403) {
                msg = '🔒 ليس لديك صلاحية لاستخدام المساعد الذكي. تواصل مع مدير النظام لتفعيل هذه الميزة.';
            } else {
                msg = 'حدث خطأ في الاتصال، يرجى المحاولة مرة أخرى.';
                try {
                    const d = JSON.parse(xhr.responseText);
                    if (d.error) msg = `⚠️ ${d.error}`;
                } catch(e) {}
            }
            appendMsg('assistant', msg);
        })
        .always(() => setBusy(false));
    }

    function appendMsg(role, text) {
        const div = document.createElement('div');
        div.className = `ai-msg ai-msg--${role}`;
        div.innerHTML = `<div class="ai-msg__bubble">${escHtml(text)}</div>`;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }

    function setBusy(state) {
        busy = state;
        sendBtn.disabled = state;

        if (state) {
            // Inject a typing bubble as the next assistant message
            _typingEl = document.createElement('div');
            _typingEl.className = 'ai-msg ai-msg--assistant';
            _typingEl.innerHTML = `
                <div class="ai-msg__bubble ai-typing-bubble">
                    <span></span><span></span><span></span>
                </div>`;
            messages.appendChild(_typingEl);
            messages.scrollTop = messages.scrollHeight;
        } else {
            // Remove the typing bubble before the real reply is appended
            if (_typingEl) { _typingEl.remove(); _typingEl = null; }
        }
    }

    function escHtml(str) {
        return str
            .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/\n/g,'<br>');
    }
}());
</script>
