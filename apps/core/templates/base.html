{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{% static 'img/logo/logo-6547bd.png' %}">
    <link rel="apple-touch-icon" href="{% static 'img/logo/logo-6547bd.png' %}">
    
    <!-- Bootstrap 5 RTL -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- DataTables RTL -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    
    <!-- Custom CSS - Main (Fonts + Colors Only) -->
    <link rel="stylesheet" href="{% static 'css/main.css' %}?v=8.1">
    
    <!-- Layout Components CSS -->
    <link rel="stylesheet" href="{% static 'css/layout.css' %}?v=1.3">
    
    <!-- Dashboard CSS -->
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}?v=1.0">
    
    <!-- Customers CSS -->
    <link rel="stylesheet" href="{% static 'css/customers.css' %}?v=1.3">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div id="global-alerts" class="container mt-3"></div>
    
    {% block body %}
    <!-- Page content goes here -->
    {% endblock %}
    
    <!-- jQuery 3.7 -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <!-- Bootstrap 5 Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- DataTables -->
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    
    <!-- Custom JS -->
    <script src="{% static 'js/main.js' %}?v=3.5"></script>
    
    {% block extra_js %}{% endblock %}
    
    <script>
        // Global AJAX setup for Django CSRF
        $.ajaxSetup({
            beforeSend: function(xhr, settings) {
                if (!(/^(GET|HEAD|OPTIONS|TRACE)$/.test(settings.type)) && !this.crossDomain) {
                    xhr.setRequestHeader("X-CSRFToken", "{{ csrf_token }}");
                }
            }
        });
        
    </script>
</body>
</html>
