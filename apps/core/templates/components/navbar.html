{% load static %}
<nav class="navbar">
    <div class="navbar-shell">

        <!-- RIGHT: Hamburger (mobile) + Brand (mobile) -->
        <div class="navbar-start">
            <button class="navbar-icon-btn sidebar-toggle d-lg-none" id="sidebarToggleBtn" aria-label="القائمة">
                <i class="fas fa-bars"></i>
            </button>
            <a class="navbar-brand-wrap" href="{% url 'core:dashboard' %}">
                <img src="{% static 'img/logo/logo-161616.png' %}" alt="إنجاز" class="navbar-logo logo-light">
                <img src="{% static 'img/logo/logo-ffffff.png' %}" alt="إنجاز" class="navbar-logo logo-dark">
                <span class="navbar-brand-text">إنجاز</span>
            </a>
        </div>

        <!-- LEFT: Actions -->
        <div class="navbar-actions">
            <!-- Theme Toggle -->
            <button class="navbar-icon-btn theme-toggle" onclick="toggleTheme()" aria-label="تبديل الوضع">
                <i class="fas fa-moon theme-icon-ref" id="theme-icon"></i>
            </button>

            <!-- Notifications -->
            <button class="navbar-icon-btn" aria-label="الإشعارات">
                <i class="fas fa-bell"></i>
                <span class="navbar-badge">3</span>
            </button>

            <div class="navbar-sep"></div>

            <!-- Tenant Info -->
            {% if current_tenant %}
            <div class="dropdown">
                <a class="navbar-menu-link dropdown-toggle" href="#" data-bs-toggle="dropdown" data-bs-display="static">
                    <i class="fas fa-store" style="font-size:0.8rem;color:var(--primary)"></i>
                    <span class="navbar-label">{{ current_tenant.name }}</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="{% url 'core:tenant_settings' %}">
                        <i class="fas fa-sliders me-2 text-primary"></i>إعدادات النشاط
                    </a></li>
                    <li><a class="dropdown-item" href="{% url 'core:subscription' %}">
                        <i class="fas fa-credit-card me-2 text-info"></i>الاشتراك
                    </a></li>
                </ul>
            </div>
            {% endif %}

            <!-- User Menu -->
            <div class="dropdown">
                <a class="navbar-menu-link dropdown-toggle" href="#" data-bs-toggle="dropdown" data-bs-display="static">
                    <span class="navbar-avatar">{{ user.get_full_name|slice:':1'|default:user.username|slice:':1'|upper }}</span>
                    <span class="navbar-label">{{ user.get_full_name|default:user.username }}</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="{% url 'accounts:profile' %}">
                        <i class="fas fa-user me-2 text-secondary"></i>الملف الشخصي
                    </a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger" href="{% url 'accounts:logout' %}">
                        <i class="fas fa-arrow-right-from-bracket me-2"></i>تسجيل الخروج
                    </a></li>
                </ul>
            </div>
        </div>

    </div>
</nav>

<script>
// Theme Toggle Functionality
function toggleTheme() {
    const html = document.documentElement;
    const currentTheme = html.getAttribute('data-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

    html.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);

    // Update all theme icons on page
    document.querySelectorAll('.theme-icon-ref').forEach(function(icon) {
        if (newTheme === 'dark') {
            icon.classList.replace('fa-moon', 'fa-sun');
        } else {
            icon.classList.replace('fa-sun', 'fa-moon');
        }
    });
}

// Load saved theme on page load
(function() {
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    if (savedTheme === 'dark') {
        document.querySelectorAll('.theme-icon-ref').forEach(function(icon) {
            icon.classList.replace('fa-moon', 'fa-sun');
        });
    }
})();
</script>
