{% extends "base.html" %}
{% load static %}
{% load humanize %}

{% block body %}
<div class="auth-page">
    <div class="container auth-container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-11 col-md-9 col-lg-7 col-xl-6">
                
                <div class="auth-card animate-fade-in">
                    <!-- Logo -->
                    <div class="text-center mb-4">
                        <div class="auth-logo">
                            <!-- Light mode: Company color logo -->
                            <img src="{% static 'img/logo/logo-6547bd.png' %}" alt="إنجاز" class="logo-light">
                            <!-- Dark mode: White logo -->
                            <img src="{% static 'img/logo/logo-ffffff.png' %}" alt="إنجاز" class="logo-dark">
                        </div>
                    </div>
                    
                    {% if messages %}
                    {% for message in messages %}
                    <div class="alert alert-{% if 'error' in message.tags or 'danger' in message.tags %}danger{% elif 'success' in message.tags %}success{% elif 'warning' in message.tags %}warning{% else %}info{% endif %} d-flex align-items-center gap-2 mb-3">
                        <i class="fas {% if 'error' in message.tags or 'danger' in message.tags %}fa-exclamation-circle{% elif 'success' in message.tags %}fa-check-circle{% elif 'warning' in message.tags %}fa-exclamation-triangle{% else %}fa-info-circle{% endif %}"></i>
                        <span>{{ message }}</span>
                    </div>
                    {% endfor %}
                    {% endif %}

                    {% block auth_content %}{% endblock %}

                    <div class="auth-footer">
                        {% block auth_links %}{% endblock %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Auto-detect system theme preference
(function() {
    const savedTheme = localStorage.getItem('theme');
    if (!savedTheme) {
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', systemDark ? 'dark' : 'light');
    } else {
        document.documentElement.setAttribute('data-theme', savedTheme);
    }
})();
</script>
{% endblock %}
