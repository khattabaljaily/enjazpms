{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<style>
/* Auth Experience - Bold, Warm, and Focused */
.auth-page {
    --auth-bg-1: #f6efe6;
    --auth-bg-2: #f2f8ef;
    --auth-bg-3: #eceff7;
    --auth-surface: #ffffff;
    --auth-text: #1f2937;
    --auth-muted: #667085;
    --auth-border: rgba(31, 41, 55, 0.12);
    --auth-primary: #0f766e;
    --auth-primary-hover: #115e59;
    --auth-primary-soft: rgba(15, 118, 110, 0.12);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background:
        radial-gradient(80% 60% at 5% 0%, rgba(15, 118, 110, 0.12), transparent 62%),
        radial-gradient(80% 70% at 90% 100%, rgba(180, 83, 9, 0.12), transparent 65%),
        linear-gradient(135deg, var(--auth-bg-1), var(--auth-bg-2) 48%, var(--auth-bg-3));
    overflow: hidden;
}

[data-theme="dark"] .auth-page {
    --auth-bg-1: #111827;
    --auth-bg-2: #0f172a;
    --auth-bg-3: #111827;
    --auth-surface: rgba(17, 24, 39, 0.86);
    --auth-text: #f3f4f6;
    --auth-muted: #9ca3af;
    --auth-border: rgba(243, 244, 246, 0.12);
    --auth-primary: #2dd4bf;
    --auth-primary-hover: #5eead4;
    --auth-primary-soft: rgba(45, 212, 191, 0.14);
}

.auth-page::before,
.auth-page::after {
    content: '';
    position: absolute;
    border-radius: 999px;
    filter: blur(36px);
    pointer-events: none;
}

.auth-page::before {
    width: 340px;
    height: 340px;
    top: -120px;
    left: -90px;
    background: rgba(15, 118, 110, 0.2);
}

.auth-page::after {
    width: 300px;
    height: 300px;
    bottom: -110px;
    right: -70px;
    background: rgba(180, 83, 9, 0.16);
}

.auth-card {
    background: var(--auth-surface);
    border-radius: 28px;
    border: 1px solid var(--auth-border);
    box-shadow:
        0 2px 8px rgba(2, 6, 23, 0.08),
        0 30px 60px rgba(2, 6, 23, 0.14);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    padding: 2.75rem 2.35rem 2.4rem;
    max-width: 520px;
    width: 100%;
    margin-right: auto;
    margin-left: auto;
    position: relative;
    z-index: 2;
}

.auth-page .row {
    justify-content: center;
}

.auth-page [class*="col-"] {
    display: flex;
    justify-content: center;
}

.auth-card::before {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    left: 0;
    height: 6px;
    border-radius: 28px 28px 0 0;
    background: linear-gradient(90deg, #0f766e, #b45309, #2563eb);
}

.auth-logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.5rem;
    background: var(--auth-primary-soft);
    border: 1px solid var(--auth-border);
    border-radius: 20px;
    padding: 1rem 1.5rem;
}

.auth-logo img {
    height: 72px;
    width: auto;
    display: block;
}

[data-theme="light"] .auth-logo .logo-dark,
[data-theme="dark"] .auth-logo .logo-light {
    display: none;
}

.auth-title {
    font-size: 1.65rem;
    font-weight: 800;
    color: var(--auth-text);
    margin-bottom: 0.45rem;
    letter-spacing: -0.015em;
}

.auth-subtitle {
    font-size: 0.98rem;
    color: var(--auth-muted);
    margin-bottom: 0;
}

.auth-card h3,
.auth-card .form-label,
.auth-card label {
    color: var(--auth-text);
}

.auth-card h3 {
    font-size: 1.3rem;
    font-weight: 800;
}

.input-group-modern {
    position: relative;
    margin-bottom: 1.1rem;
}

.input-group-modern label {
    display: block;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--auth-text);
    margin-bottom: 0.48rem;
}

.auth-card input,
.auth-card select,
.auth-card textarea {
    width: 100%;
    padding: 0.82rem 0.96rem;
    font-size: 0.94rem;
    color: var(--auth-text);
    background: rgba(255, 255, 255, 0.88);
    border: 1.5px solid var(--auth-border);
    border-radius: 12px;
    transition: all 0.18s ease;
}

[data-theme="dark"] .auth-card input,
[data-theme="dark"] .auth-card select,
[data-theme="dark"] .auth-card textarea {
    background: rgba(17, 24, 39, 0.85);
}

.auth-card input:focus,
.auth-card select:focus,
.auth-card textarea:focus {
    outline: none;
    border-color: var(--auth-primary);
    box-shadow: 0 0 0 4px var(--auth-primary-soft);
    transform: translateY(-1px);
}

.auth-card input::placeholder,
.auth-card textarea::placeholder {
    color: #9aa4b2;
}

.auth-card .btn,
.btn-auth {
    width: 100%;
    border-radius: 12px;
    padding: 0.85rem 1rem;
    font-size: 0.95rem;
    font-weight: 700;
    border: none;
    cursor: pointer;
    transition: all 0.18s ease;
}

.auth-card .btn-primary,
.btn-auth {
    color: #ffffff;
    background: linear-gradient(135deg, var(--auth-primary), #0f5f95);
}

.auth-card .btn-primary:hover,
.btn-auth:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 24px rgba(15, 118, 110, 0.22);
    background: linear-gradient(135deg, var(--auth-primary-hover), #0c4f7e);
}

.auth-card .btn-success {
    color: #ffffff;
    background: linear-gradient(135deg, #0f766e, #15803d);
}

.auth-card .btn-success:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 24px rgba(21, 128, 61, 0.22);
}

.auth-card .btn-outline-primary,
.auth-card .btn-outline-secondary {
    background: transparent;
    border: 1.5px solid var(--auth-border);
    color: var(--auth-text);
}

.auth-card .btn-outline-primary:hover,
.auth-card .btn-outline-secondary:hover {
    background: var(--auth-primary-soft);
    border-color: var(--auth-primary);
    color: var(--auth-primary);
}

.auth-options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.4rem;
    font-size: 0.875rem;
    color: var(--auth-muted);
}

.auth-options a,
.auth-footer a,
.auth-card a {
    color: var(--auth-primary);
    text-decoration: none;
    font-weight: 600;
}

.auth-options a:hover,
.auth-footer a:hover,
.auth-card a:hover {
    color: var(--auth-primary-hover);
}

.auth-footer {
    text-align: center;
    margin-top: 1.7rem;
    padding-top: 1.4rem;
    border-top: 1px dashed var(--auth-border);
    font-size: 0.9rem;
    color: var(--auth-muted);
}

.auth-card .form-check {
    gap: 0.45rem;
}

.auth-card .form-check-input {
    width: 18px;
    height: 18px;
    margin-left: 0.4rem;
    accent-color: var(--auth-primary);
}

.auth-card .alert {
    border-radius: 12px;
    border: 1px solid rgba(220, 38, 38, 0.2);
    font-size: 0.9rem;
}

.progress-steps {
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    margin-bottom: 1.5rem;
    gap: 0.25rem;
}

.progress-steps::before {
    content: '';
    position: absolute;
    top: 18px;
    right: 28px;
    left: 28px;
    height: 2px;
    background: var(--auth-border);
    z-index: 0;
}

.progress-step {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.45rem;
    position: relative;
    z-index: 1;
}

.progress-step-circle {
    width: 36px;
    height: 36px;
    border-radius: 999px;
    background: transparent;
    border: 1.5px solid var(--auth-border);
    color: var(--auth-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    transition: all 0.18s ease;
}

.progress-step.active,
.progress-step.completed {
    background: transparent;
}

.progress-step.active .progress-step-circle,
.progress-step.completed .progress-step-circle {
    border-color: var(--auth-primary);
    color: #ffffff;
    background: var(--auth-primary);
}

.progress-step-label {
    font-size: 0.76rem;
    font-weight: 700;
    color: var(--auth-muted);
    line-height: 1.3;
    text-align: center;
}

.progress-step.active .progress-step-label,
.progress-step.completed .progress-step-label {
    color: var(--auth-primary);
}

@media (max-width: 576px) {
    .auth-card {
        padding: 2.1rem 1.15rem 1.7rem;
        border-radius: 20px;
    }

    .auth-logo {
        padding: 0.85rem 1rem;
        border-radius: 14px;
    }

    .auth-logo img {
        height: 60px;
    }

    .auth-title {
        font-size: 1.35rem;
    }

    .progress-step-label {
        font-size: 0.69rem;
    }

    .progress-steps::before {
        right: 24px;
        left: 24px;
    }
}
</style>
{% endblock %}

{% block body %}
<div class="auth-page">
    <div class="container" style="position: relative; z-index: 10;">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-11 col-md-9 col-lg-7 col-xl-6">
                
                <div class="auth-card animate-fade-in">
                    <!-- Logo -->
                    <div class="text-center mb-4">
                        <div class="auth-logo">
                            <!-- Light mode: Company color logo -->
                            <img src="{% static 'img/logo/logo-6547bd.png' %}" alt="إنجاز" class="logo-light">
                            <!-- Dark mode: White logo -->
                            <img src="{% static 'img/logo/logo-ffffff.png' %}" alt="إنجاز" class="logo-dark">
                        </div>
                    </div>
                    
                    {% block auth_content %}{% endblock %}

                    <div class="auth-footer">
                        {% block auth_links %}{% endblock %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Auto-detect system theme preference
(function() {
    const savedTheme = localStorage.getItem('theme');
    if (!savedTheme) {
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', systemDark ? 'dark' : 'light');
    } else {
        document.documentElement.setAttribute('data-theme', savedTheme);
    }
})();
</script>
{% endblock %}
