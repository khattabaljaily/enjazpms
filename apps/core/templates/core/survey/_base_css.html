{% load static %}
<style>
@font-face{font-family:Cairo;font-weight:400;src:url('{% static "fonts/cairo/Cairo-Regular.ttf" %}') format('truetype');font-display:swap}
@font-face{font-family:Cairo;font-weight:600;src:url('{% static "fonts/cairo/Cairo-SemiBold.ttf" %}') format('truetype');font-display:swap}
@font-face{font-family:Cairo;font-weight:700;src:url('{% static "fonts/cairo/Cairo-Bold.ttf" %}') format('truetype');font-display:swap}
:root{--navy:#1b2236;--gold:#c9840f;--orange:#f5a623;--ink:#1b2236;--muted:#6b7280;--line:#e3e7ee;--fill:#f4f6fa}
*{box-sizing:border-box}
body{margin:0;background:#eef1f6;font-family:Cairo,system-ui,sans-serif;color:var(--ink);line-height:1.8}
.sv-head{background:var(--navy);border-bottom:4px solid var(--orange);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.sv-head h1{margin:0;font-size:1.05rem;color:#f9d99a;font-weight:700}
.sv-head .brand{color:var(--orange);font-weight:700;letter-spacing:.5px}
.sv-wrap{max-width:820px;margin:18px auto;padding:0 14px 40px}
.sv-card{background:#fff;border-radius:14px;padding:22px 22px 8px;box-shadow:0 2px 14px rgba(27,34,54,.07)}
.sv-intro{font-size:.95rem;margin:0 0 12px}
.sv-callout{border-right:4px solid var(--gold);background:#fdf3e1;color:#7a4b00;padding:10px 14px;border-radius:6px;font-size:.88rem;margin:10px 0}
.sv-callout--info{border-color:#4a63c9;background:#eef2fb;color:#2b3a7a}
.sv-sec{font-size:1.35rem;font-weight:700;color:var(--gold);margin:28px 0 2px}
.sv-sec::after{content:"";display:block;width:56px;height:3px;background:var(--orange);margin-top:2px;border-radius:2px}
.sv-q{padding:16px 0;border-bottom:1px solid var(--line)}
.sv-sub{margin-top:14px;padding-right:2px}
.sv-q-title{display:flex;gap:10px;align-items:flex-start;font-weight:700;font-size:1.02rem}
.sv-sub .sv-q-title{color:var(--gold);font-size:.95rem}
.sv-badge{flex:none;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem}
.sv-hint{margin:2px 0 8px;color:var(--muted);font-size:.84rem}
.sv-label{display:block;font-weight:600;font-size:.88rem;color:#4b5563;margin-bottom:4px}
.sv-field{margin:12px 0}
.sv-input{width:100%;border:1px solid #cfd6e2;background:var(--fill);border-radius:8px;padding:9px 12px;font:inherit;color:var(--ink)}
.sv-input:focus{outline:2px solid var(--orange);outline-offset:0;background:#fff}
textarea.sv-input{resize:vertical;min-height:84px}
.sv-input--count{width:96px;text-align:center;flex:none}
.sv-input[inputmode=numeric],.sv-input[inputmode=tel]{direction:ltr;text-align:right}
.sv-field--plain .sv-input[inputmode=numeric]{max-width:200px}
.sv-opt{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;cursor:pointer;border-radius:8px}
.sv-opt:hover{background:#fafbfd}
.sv-opt input{position:absolute;opacity:0;pointer-events:none}
.sv-mark{flex:none;width:22px;height:22px;border:2px solid var(--gold);background:#fff;margin-top:3px;position:relative}
.sv-mark--radio{border-radius:50%}
.sv-mark--check{border-radius:6px}
.sv-opt input:checked + .sv-mark--radio::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--gold)}
.sv-opt input:checked + .sv-mark--check{background:var(--gold)}
.sv-opt input:checked + .sv-mark--check::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.sv-opt input:focus-visible + .sv-mark{outline:2px solid var(--orange);outline-offset:2px}
.sv-opt input:checked ~ .sv-opt-text{font-weight:600}
.sv-opt-text small{display:block;color:var(--muted);font-size:.8rem;font-weight:400;line-height:1.6}
.sv-count{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sv-count .sv-opt{flex:1}
.sv-note{border-right:4px solid #4a63c9;background:#eef2fb;color:#2b3a7a;padding:10px 14px;border-radius:6px;font-size:.85rem;margin:10px 0 2px}
.sv-shot{width:100%;max-width:460px;border-radius:8px;margin:6px 0 8px;display:block}
.sv-actions{padding:22px 0 14px;text-align:center}
.sv-btn{border:0;background:linear-gradient(135deg,#f5a623,#c9840f);color:#fff;font:inherit;font-weight:700;font-size:1.05rem;padding:12px 38px;border-radius:12px;cursor:pointer}
.sv-btn:disabled{opacity:.6;cursor:wait}
.sv-errors{background:#fdecec;color:#9b1c1c;border-radius:8px;padding:10px 16px;margin:0 0 14px;font-size:.9rem}
.sv-errors ul{margin:0;padding-right:18px}
.sv-done{text-align:center;padding:50px 20px}
.sv-done .ok{width:72px;height:72px;border-radius:50%;background:var(--gold);color:#fff;font-size:2.4rem;display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px}
.sv-foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:10px}
@media(max-width:520px){.sv-card{padding:16px 14px 4px}.sv-head h1{font-size:.92rem}}
</style>
