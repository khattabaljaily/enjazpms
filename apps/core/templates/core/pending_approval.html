{% extends "layouts/auth.html" %}
{% load humanize %}

{% block auth_content %}
<div class="text-center">
    <div class="mb-4">
        <i class="fas fa-hourglass-half fa-5x text-warning"></i>
    </div>

    <h3 class="mb-3">حسابك قيد المراجعة</h3>

    <p class="text-muted mb-4">
        تم إنشاء حسابك التجريبي بنجاح.<br>
        سيقوم فريقنا بمراجعة طلبك، وسيصلك بريد إلكتروني فور تفعيل الحساب.
    </p>

    <div class="d-grid gap-2">
        <a href="{% url 'accounts:logout' %}" class="btn btn-outline-secondary">
            <i class="fas fa-sign-out-alt me-2"></i>
            تسجيل الخروج
        </a>
    </div>
</div>
{% endblock %}
