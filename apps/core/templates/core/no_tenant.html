{% extends "layouts/auth.html" %}
{% load humanize %}

{% block auth_content %}
<div class="text-center">
    <div class="mb-4">
        <i class="fas fa-store-slash fa-5x text-danger"></i>
    </div>
    
    <h3 class="mb-3">لا يوجد نشاط تجاري</h3>
    
    <p class="text-muted mb-4">
        عذراً، حسابك غير مرتبط بأي نشاط تجاري.<br>
        يرجى التواصل مع الإدارة أو إنشاء حساب جديد.
    </p>
    
    <div class="d-grid gap-2">
        <a href="{% url 'accounts:register_step1' %}" class="btn btn-primary">
            <i class="fas fa-plus me-2"></i>
            إنشاء نشاط جديد
        </a>
        <a href="{% url 'accounts:logout' %}" class="btn btn-outline-secondary">
            <i class="fas fa-sign-out-alt me-2"></i>
            تسجيل الخروج
        </a>
    </div>
</div>
{% endblock %}
