{% extends "layouts/auth.html" %}
{% load humanize %}

{% block auth_content %}
<div class="text-center">
    <div class="mb-4">
        <i class="fas fa-exclamation-triangle fa-5x text-warning"></i>
    </div>
    
    <h3 class="mb-3">انتهى اشتراكك</h3>
    
    <p class="text-muted mb-4">
        عذراً، اشتراكك في النظام قد انتهى.<br>
        يرجى تجديد الاشتراك للاستمرار في استخدام النظام.
    </p>
    
    <div class="d-grid gap-2">
        <a href="{% url 'core:subscription' %}" class="btn btn-primary">
            <i class="fas fa-credit-card me-2"></i>
            تجديد الاشتراك
        </a>
        <a href="{% url 'accounts:logout' %}" class="btn btn-outline-secondary">
            <i class="fas fa-sign-out-alt me-2"></i>
            تسجيل الخروج
        </a>
    </div>
</div>
{% endblock %}
