{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صيانة النظام</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #1e3a5f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cairo', sans-serif;
        }
        .maint-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            text-align: center;
            max-width: 520px;
            width: 90%;
            color: #e2e8f0;
        }
        .maint-icon {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: rgba(99,102,241,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: #818cf8;
            margin: 0 auto 1.5rem;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(99,102,241,0.3); }
            50%       { box-shadow: 0 0 0 14px rgba(99,102,241,0); }
        }
        .maint-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 0.5rem;
        }
        .maint-msg {
            color: #94a3b8;
            font-size: 1rem;
            line-height: 1.7;
        }
        .maint-footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #475569;
        }
        .maint-gear {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 1.5rem;
        }
        .maint-gear span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #6366f1;
            animation: bounce 1.2s infinite ease-in-out;
        }
        .maint-gear span:nth-child(2) { animation-delay: 0.2s; background: #818cf8; }
        .maint-gear span:nth-child(3) { animation-delay: 0.4s; background: #a5b4fc; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
            40%            { transform: scale(1);   opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="maint-card">
        <div class="maint-icon"><i class="fas fa-tools"></i></div>
        <div class="maint-title">وضع الصيانة</div>
        <p class="maint-msg">
            {{ message|default:"نحن نجري بعض التحسينات لخدمتكم بشكل أفضل. سنعود قريباً، يرجى المحاولة لاحقاً." }}
        </p>
        <div class="maint-gear">
            <span></span><span></span><span></span>
        </div>
        <div class="maint-footer">EnjazIMS &mdash; نظام إدارة المخزون ونقاط البيع</div>
    </div>
</body>
</html>
