{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title|default:"بوابة العميل" }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
  font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
}
.error-card {
  background: #fff;
  border-radius: 20px;
  padding: 2.5rem 2rem;
  text-align: center;
  max-width: 420px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
}
.error-icon {
  width: 70px; height: 70px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 1.25rem;
  font-size: 1.8rem;
}
.error-icon--error   { background: #fef2f2; color: #dc2626; }
.error-icon--success { background: #f0fdf4; color: #059669; }
.error-title   { font-size: 1.35rem; font-weight: 700; margin-bottom: .5rem; color: #1e293b; }
.error-message { font-size: .92rem; color: #64748b; line-height: 1.6; }
</style>
</head>
<body>
<div class="error-card">
  <div class="error-icon {% if logged_out %}error-icon--success{% else %}error-icon--error{% endif %}">
    <i class="fas {{ icon|default:'fa-lock' }}"></i>
  </div>
  <h1 class="error-title">{{ title }}</h1>
  <p class="error-message">{{ message }}</p>
</div>
</body>
</html>
