{% load static portal_extras %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}بوابة العميل{% endblock %} — {{ tenant.name }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --p-primary: #4f46e5;
  --p-primary-dark: #3730a3;
  --p-accent: #7c3aed;
  --p-surface: #ffffff;
  --p-bg: #f1f5f9;
  --p-border: #e2e8f0;
  --p-text: #1e293b;
  --p-muted: #64748b;
  --p-success: #059669;
  --p-warning: #d97706;
  --p-danger: #dc2626;
}
* { box-sizing: border-box; }
body {
  background: var(--p-bg);
  font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
  color: var(--p-text);
  min-height: 100vh;
}

/* ── Navbar ── */
.portal-nav {
  background: linear-gradient(135deg, var(--p-primary) 0%, var(--p-accent) 100%);
  padding: 0.75rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 12px rgba(79,70,229,.3);
  position: sticky;
  top: 0;
  z-index: 100;
}
.portal-nav-brand {
  display: flex;
  align-items: center;
  gap: .6rem;
  color: #fff;
  font-size: 1.05rem;
  font-weight: 700;
  text-decoration: none;
}
.portal-nav-brand i { font-size: 1.3rem; opacity: .9; }
.portal-nav-user {
  display: flex;
  align-items: center;
  gap: .75rem;
}
.portal-nav-customer {
  color: rgba(255,255,255,.9);
  font-size: .88rem;
}
.portal-nav-customer strong { color: #fff; display: block; font-size: .95rem; }
.portal-logout {
  background: rgba(255,255,255,.15);
  border: 1px solid rgba(255,255,255,.3);
  color: #fff;
  border-radius: 8px;
  padding: .35rem .75rem;
  font-size: .83rem;
  text-decoration: none;
  transition: background .15s;
}
.portal-logout:hover { background: rgba(255,255,255,.25); color: #fff; }

/* ── Nav Tabs ── */
.portal-tabs {
  background: var(--p-surface);
  border-bottom: 1px solid var(--p-border);
  padding: 0 1.5rem;
}
.portal-tabs .nav-link {
  color: var(--p-muted);
  font-size: .9rem;
  padding: .75rem 1rem;
  border: none;
  border-bottom: 2px solid transparent;
  border-radius: 0;
  transition: color .15s;
}
.portal-tabs .nav-link:hover { color: var(--p-primary); }
.portal-tabs .nav-link.active {
  color: var(--p-primary);
  border-bottom-color: var(--p-primary);
  font-weight: 600;
  background: none;
}

/* ── Main ── */
.portal-main { padding: 1.5rem; max-width: 1100px; margin: 0 auto; }

/* ── Stat cards ── */
.p-stat {
  background: var(--p-surface);
  border-radius: 14px;
  padding: 1.25rem 1.5rem;
  box-shadow: 0 1px 6px rgba(0,0,0,.06);
  display: flex;
  align-items: center;
  gap: 1rem;
}
.p-stat-icon {
  width: 48px; height: 48px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem;
  flex-shrink: 0;
}
.p-stat-icon--primary { background: rgba(79,70,229,.1); color: var(--p-primary); }
.p-stat-icon--success { background: rgba(5,150,105,.1); color: var(--p-success); }
.p-stat-icon--warning { background: rgba(217,119,6,.1); color: var(--p-warning); }
.p-stat-icon--danger  { background: rgba(220,38,38,.1); color: var(--p-danger); }
.p-stat-label { font-size: .8rem; color: var(--p-muted); margin-bottom: .15rem; }
.p-stat-value { font-size: 1.4rem; font-weight: 700; color: var(--p-text); line-height: 1.1; }

/* ── Panel ── */
.p-panel {
  background: var(--p-surface);
  border-radius: 14px;
  box-shadow: 0 1px 6px rgba(0,0,0,.06);
  overflow: hidden;
}
.p-panel-head {
  padding: 1rem 1.25rem;
  border-bottom: 1px solid var(--p-border);
  font-weight: 600;
  font-size: .95rem;
  display: flex;
  align-items: center;
  gap: .5rem;
}
.p-panel-head i { color: var(--p-primary); }

/* ── Table ── */
.p-table { width: 100%; border-collapse: collapse; }
.p-table th {
  background: #f8fafc;
  font-size: .78rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .03em;
  color: var(--p-muted);
  padding: .65rem 1rem;
  border-bottom: 1px solid var(--p-border);
}
.p-table td {
  padding: .75rem 1rem;
  border-bottom: 1px solid var(--p-border);
  font-size: .9rem;
  vertical-align: middle;
}
.p-table tr:last-child td { border-bottom: none; }
.p-table tr:hover td { background: #fafbff; }
.p-table .text-end { text-align: left; }

/* ── Status badges ── */
.p-badge {
  display: inline-flex;
  align-items: center;
  gap: .3rem;
  padding: .2rem .6rem;
  border-radius: 20px;
  font-size: .78rem;
  font-weight: 600;
}
.p-badge--paid    { background: rgba(5,150,105,.1); color: var(--p-success); }
.p-badge--partial { background: rgba(217,119,6,.1); color: var(--p-warning); }
.p-badge--unpaid  { background: rgba(220,38,38,.1); color: var(--p-danger); }

/* ── Section title ── */
.p-section-title {
  font-size: 1rem;
  font-weight: 700;
  color: var(--p-text);
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: .5rem;
}
.p-section-title i { color: var(--p-primary); }

/* ── Invoice detail ── */
.p-inv-head {
  background: linear-gradient(135deg, var(--p-primary) 0%, var(--p-accent) 100%);
  border-radius: 14px;
  padding: 1.5rem;
  color: #fff;
  margin-bottom: 1.5rem;
}
.p-inv-head-title { font-size: 1.4rem; font-weight: 700; margin-bottom: .25rem; }
.p-inv-head-sub   { opacity: .85; font-size: .9rem; }
.p-inv-meta       { display: flex; flex-wrap: wrap; gap: .5rem 2rem; margin-top: .75rem; }
.p-inv-meta-item  { font-size: .88rem; opacity: .9; }
.p-inv-meta-item strong { display: block; font-size: .95rem; opacity: 1; }

/* ── Total box ── */
.p-total-box {
  background: #f8fafc;
  border: 1px solid var(--p-border);
  border-radius: 12px;
  padding: 1rem 1.25rem;
}
.p-total-row {
  display: flex;
  justify-content: space-between;
  padding: .35rem 0;
  font-size: .9rem;
  border-bottom: 1px dashed var(--p-border);
}
.p-total-row:last-child { border-bottom: none; font-weight: 700; font-size: 1rem; padding-top: .5rem; }

/* ── Empty state ── */
.p-empty {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--p-muted);
}
.p-empty i { font-size: 2.5rem; margin-bottom: .75rem; opacity: .4; display: block; }
.p-empty p  { font-size: .95rem; }

/* Mobile */
@media (max-width: 576px) {
  .portal-main { padding: 1rem .75rem; }
  .p-stat-value { font-size: 1.15rem; }
  .p-table th, .p-table td { padding: .55rem .75rem; font-size: .82rem; }
  .hide-mobile { display: none !important; }
}
</style>
{% block extra_css %}{% endblock %}
</head>
<body>

<nav class="portal-nav">
  <a href="{% url 'portal:dashboard' %}" class="portal-nav-brand">
    <i class="fas fa-store"></i>
    <span>{{ tenant.name }}</span>
  </a>
  <div class="portal-nav-user">
    <div class="portal-nav-customer">
      <strong>{{ customer.name }}</strong>
      بوابة العميل
    </div>
    <a href="{% url 'portal:logout' %}" class="portal-logout">
      <i class="fas fa-sign-out-alt me-1"></i>خروج
    </a>
  </div>
</nav>

<div class="portal-tabs">
  <ul class="nav">
    <li class="nav-item">
      <a class="nav-link {% block tab_dashboard %}{% endblock %}" href="{% url 'portal:dashboard' %}">
        <i class="fas fa-gauge-high me-1"></i>الرئيسية
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% block tab_invoices %}{% endblock %}" href="{% url 'portal:invoices' %}">
        <i class="fas fa-file-invoice me-1"></i>فواتيري
      </a>
    </li>
  </ul>
</div>

<div class="portal-main">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
