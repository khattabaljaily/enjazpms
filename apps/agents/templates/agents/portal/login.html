<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة المندوب — تسجيل الدخول</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body { background: linear-gradient(135deg,#6366f1,#818cf8); min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Cairo',sans-serif; }
.login-card { background:#fff; border-radius:20px; padding:2.5rem; width:100%; max-width:420px; box-shadow:0 20px 60px rgba(0,0,0,.2); }
.login-icon { width:72px;height:72px;background:linear-gradient(135deg,#6366f1,#818cf8);border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;color:#fff;font-size:2rem; }
.login-title { text-align:center;font-size:1.3rem;font-weight:700;color:#1e293b;margin-bottom:.25rem; }
.login-sub { text-align:center;font-size:.85rem;color:#64748b;margin-bottom:1.75rem; }
.login-label { font-size:.85rem;font-weight:600;color:#374151;margin-bottom:.35rem; }
.login-input { border:1.5px solid #e5e7eb;border-radius:10px;padding:.65rem 1rem;font-size:.9rem;width:100%;transition:border .15s;font-family:'Cairo',sans-serif; }
.login-input:focus { border-color:#6366f1;outline:none;box-shadow:0 0 0 3px rgba(99,102,241,.12); }
.login-btn { background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;border:none;border-radius:10px;padding:.75rem;font-size:.95rem;font-weight:700;width:100%;cursor:pointer;transition:opacity .15s;font-family:'Cairo',sans-serif; }
.login-btn:hover { opacity:.9; }
.login-error { background:#fef2f2;border:1px solid #fecaca;color:#dc2626;border-radius:10px;padding:.65rem 1rem;font-size:.85rem;margin-bottom:1rem; }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-icon"><i class="fas fa-id-badge"></i></div>
  <h1 class="login-title">بوابة المندوب</h1>
  <p class="login-sub">أدخل بيانات دخولك للمتابعة</p>

  {% if error %}
  <div class="login-error"><i class="fas fa-exclamation-circle me-1"></i>{{ error }}</div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="login-label">اسم المستخدم</label>
      <input type="text" name="username" class="login-input" placeholder="اسم المستخدم" autocomplete="username" required>
    </div>
    <div class="mb-4">
      <label class="login-label">كلمة المرور</label>
      <input type="password" name="password" class="login-input" placeholder="••••••••" autocomplete="current-password" required>
    </div>
    <button type="submit" class="login-btn"><i class="fas fa-sign-in-alt me-2"></i>دخول</button>
  </form>
</div>
</body>
</html>
