<!-- ══ QR Print Modal ══════════════════════════════════════════════ -->
<div id="qrPrintModal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,.7);backdrop-filter:blur(6px);align-items:center;justify-content:center;" onclick="if(event.target===this)closeStoreQR()">
  <div style="background:var(--surface,#fff);border-radius:20px;box-shadow:0 32px 96px rgba(0,0,0,.35);max-width:480px;width:94%;max-height:94vh;overflow-y:auto;display:flex;flex-direction:column;">

    <!-- Modal header -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.4rem;border-bottom:1px solid var(--border-color,#e2e8f0);flex-shrink:0;">
      <div style="display:flex;align-items:center;gap:.55rem;font-weight:700;font-size:.97rem;color:var(--text-primary,#0f172a);">
        <i class="fas fa-qrcode" style="color:#6366f1;font-size:1.05rem;"></i>
        رمز QR للمتجر
      </div>
      <button onclick="closeStoreQR()" style="background:none;border:none;cursor:pointer;color:var(--text-secondary,#64748b);font-size:1.4rem;padding:.15rem .4rem;border-radius:6px;line-height:1;transition:color .15s;" title="إغلاق">&times;</button>
    </div>

    <!-- Preview Sheet -->
    <div style="padding:1.1rem;flex:1;">
      <div id="qrA4Sheet" style="background:#fff;border-radius:14px;border:1.5px solid #e2e8f0;overflow:hidden;font-family:'Cairo',-apple-system,sans-serif;">

        <!-- Header band with decorative circles -->
        <div style="background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 60%,#6d28d9 100%);padding:1.8rem 1.4rem 1.4rem;text-align:center;color:#fff;position:relative;overflow:hidden;">
          <div style="position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.06);top:-40px;left:-30px;"></div>
          <div style="position:absolute;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.06);bottom:-20px;right:-15px;"></div>
          <div style="position:absolute;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.08);top:10px;right:30px;"></div>
          <div style="position:relative;z-index:1;">
            <div style="display:inline-flex;align-items:center;gap:.4rem;background:rgba(255,255,255,.15);border-radius:20px;padding:.25rem .75rem;font-size:.72rem;letter-spacing:.06em;margin-bottom:.65rem;">
              <i class="fas fa-store" style="font-size:.7rem;"></i>
              متجرك الإلكتروني
            </div>
            <div id="qrStoreName" style="font-size:1.5rem;font-weight:800;line-height:1.25;text-shadow:0 2px 8px rgba(0,0,0,.15);"></div>
          </div>
        </div>

        <!-- QR code area -->
        <div style="padding:1.4rem 1.4rem .8rem;text-align:center;">

          <!-- Scan badge -->
          <div style="display:inline-flex;align-items:center;gap:.45rem;background:linear-gradient(90deg,rgba(99,102,241,.1),rgba(124,58,237,.1));border:1.5px solid rgba(99,102,241,.2);border-radius:30px;padding:.3rem .9rem;font-size:.78rem;font-weight:700;color:#4f46e5;margin-bottom:1rem;">
            <i class="fas fa-mobile-screen-button"></i>
            امسح للتسوق الآن
          </div>

          <!-- QR image -->
          <div style="display:inline-block;background:#fff;border-radius:18px;padding:12px;box-shadow:0 6px 32px rgba(79,70,229,.18);border:2px solid rgba(99,102,241,.15);">
            <img id="qrCodeImg" src="" alt="QR Code" style="width:200px;height:200px;display:block;">
          </div>

          <!-- Divider -->
          <div style="display:flex;align-items:center;gap:.6rem;margin:1rem 1.5rem;">
            <div style="flex:1;height:1px;background:linear-gradient(90deg,transparent,#e2e8f0);"></div>
            <i class="fas fa-link" style="color:#cbd5e1;font-size:.7rem;"></i>
            <div style="flex:1;height:1px;background:linear-gradient(90deg,#e2e8f0,transparent);"></div>
          </div>

          <!-- URL -->
          <div style="background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:10px;padding:.6rem .9rem;max-width:100%;word-break:break-all;margin-bottom:.8rem;">
            <div style="font-size:.64rem;color:#94a3b8;margin-bottom:.2rem;text-align:right;">رابط المتجر</div>
            <div id="qrStoreUrl" style="font-size:.78rem;font-weight:700;color:#6366f1;direction:ltr;text-align:left;"></div>
          </div>
        </div>

        <!-- Features footer -->
        <div style="background:linear-gradient(135deg,#f8faff,#f3f4ff);border-top:1px solid rgba(99,102,241,.12);padding:.85rem 1rem;display:flex;justify-content:space-around;text-align:center;">
          <div style="flex:1;">
            <div style="font-size:.95rem;margin-bottom:.2rem;">🛒</div>
            <div style="font-size:.68rem;font-weight:700;color:#4f46e5;">تسوق سهل</div>
          </div>
          <div style="width:1px;background:rgba(99,102,241,.15);"></div>
          <div style="flex:1;">
            <div style="font-size:.95rem;margin-bottom:.2rem;">🔒</div>
            <div style="font-size:.68rem;font-weight:700;color:#4f46e5;">آمن وموثوق</div>
          </div>
          <div style="width:1px;background:rgba(99,102,241,.15);"></div>
          <div style="flex:1;">
            <div style="font-size:.95rem;margin-bottom:.2rem;">⚡</div>
            <div style="font-size:.68rem;font-weight:700;color:#4f46e5;">سريع وفوري</div>
          </div>
        </div>

      </div>
    </div>

    <!-- Modal actions -->
    <div style="display:flex;gap:.65rem;padding:0 1.1rem 1.1rem;justify-content:flex-end;flex-shrink:0;">
      <button onclick="closeStoreQR()" style="padding:.5rem 1.1rem;border-radius:9px;border:1.5px solid var(--border-color,#e2e8f0);background:var(--surface,#fff);color:var(--text-secondary,#64748b);cursor:pointer;font-size:.86rem;font-family:inherit;font-weight:600;">
        إغلاق
      </button>
      <button onclick="printStoreQR()" style="padding:.5rem 1.3rem;border-radius:9px;border:none;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;cursor:pointer;font-size:.86rem;font-family:inherit;font-weight:700;display:flex;align-items:center;gap:.45rem;box-shadow:0 4px 14px rgba(79,70,229,.35);">
        <i class="fas fa-print"></i> طباعة A4
      </button>
    </div>
  </div>
</div>

<script>
(function () {
  function openStoreQR(url, name) {
    document.getElementById('qrStoreName').textContent = name || 'متجرنا';
    document.getElementById('qrStoreUrl').textContent = url;
    document.getElementById('qrCodeImg').src =
      'https://api.qrserver.com/v1/create-qr-code/?size=500x500&margin=12&data=' + encodeURIComponent(url);
    document.getElementById('qrPrintModal').style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }

  function closeStoreQR() {
    document.getElementById('qrPrintModal').style.display = 'none';
    document.body.style.overflow = '';
  }

  function printStoreQR() {
    const storeName = document.getElementById('qrStoreName').textContent;
    const storeUrl  = document.getElementById('qrStoreUrl').textContent;
    const qrSrc     = document.getElementById('qrCodeImg').src;

    const win = window.open('', '_blank', 'width=860,height=1100');
    win.document.write(`<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<title>رمز QR - ` + storeName + `</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#fff}
body{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact}
@page{size:A4 portrait;margin:0}

.page{
  width:210mm;height:297mm;
  margin:0 auto;
  background:#fff;
  display:flex;flex-direction:column;
  overflow:hidden;
}

/* Header */
.hdr{
  background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#6d28d9 100%);
  padding:10mm 14mm 9mm;
  text-align:center;color:#fff;
  position:relative;overflow:hidden;
  flex-shrink:0;
}
.orb{position:absolute;border-radius:50%;background:rgba(255,255,255,.07)}
.o1{width:60mm;height:60mm;top:-22mm;left:-14mm}
.o2{width:42mm;height:42mm;bottom:-12mm;right:-8mm}
.o3{width:24mm;height:24mm;top:6mm;right:20mm}
.hdr-badge{
  display:inline-flex;align-items:center;gap:1.5mm;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);
  border-radius:20mm;padding:1mm 4.5mm;font-size:8.5pt;
  margin-bottom:3.5mm;position:relative;z-index:1;
}
.hdr-name{
  font-size:24pt;font-weight:900;line-height:1.2;
  position:relative;z-index:1;
  text-shadow:0 1.5mm 6mm rgba(0,0,0,.2);
}
.hdr-rule{
  width:16mm;height:2.5px;background:rgba(255,255,255,.45);
  border-radius:2px;margin:3.5mm auto 0;position:relative;z-index:1;
}

/* Body */
.body{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:space-evenly;
  padding:6mm 14mm 4mm;
}

/* Scan label */
.scan-label{
  display:inline-flex;align-items:center;gap:2mm;
  background:linear-gradient(90deg,rgba(79,70,229,.08),rgba(124,58,237,.08));
  border:1.5px solid rgba(99,102,241,.25);
  border-radius:20mm;padding:1.5mm 6mm;
  font-size:10.5pt;font-weight:700;color:#4f46e5;
}

/* QR */
.qr-card{
  background:#fff;border-radius:6mm;padding:5.5mm;
  box-shadow:0 3mm 16mm rgba(79,70,229,.22),0 1mm 3mm rgba(79,70,229,.1);
  border:2px solid rgba(99,102,241,.18);
}
.qr-card img{width:78mm;height:78mm;display:block}

/* URL */
.url-wrap{
  display:flex;align-items:stretch;
  background:#f8fafc;border:1.5px solid #e2e8f0;
  border-radius:7px;overflow:hidden;
  width:100%;max-width:155mm;
}
.url-icon{
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  color:#fff;display:flex;align-items:center;justify-content:center;
  padding:0 4.5mm;font-size:10.5pt;flex-shrink:0;
}
.url-content{padding:2.5mm 4.5mm}
.url-lbl{font-size:6.5pt;color:#94a3b8;margin-bottom:.8mm}
.url-txt{font-size:9pt;font-weight:700;color:#4f46e5;direction:ltr;text-align:left;word-break:break-all}

/* Features */
.features{
  display:flex;width:100%;max-width:155mm;
  border:1.5px solid rgba(99,102,241,.14);
  border-radius:7px;overflow:hidden;
}
.feat{flex:1;text-align:center;padding:4mm 2mm;background:linear-gradient(160deg,#f8faff,#eff0ff)}
.feat+.feat{border-right:1px solid rgba(99,102,241,.12)}
.feat-icon{font-size:14pt;margin-bottom:1.5mm;display:block}
.feat-title{font-size:8pt;font-weight:800;color:#3730a3;margin-bottom:.8mm}
.feat-sub{font-size:6.5pt;color:#6366f1;opacity:.75}

/* Footer */
.footer{
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  padding:4mm 14mm;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  gap:3mm;color:rgba(255,255,255,.88);font-size:7.5pt;letter-spacing:.03em;
}
.dot{width:2.5px;height:2.5px;border-radius:50%;background:rgba(255,255,255,.55)}
</style>
</head>
<body>
<div class="page">
  <div class="hdr">
    <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
    <div class="hdr-badge">&#128722; متجرك الإلكتروني</div>
    <div class="hdr-name">` + storeName + `</div>
    <div class="hdr-rule"></div>
  </div>

  <div class="body">
    <div class="scan-label">&#128241; امسح رمز QR للتسوق الآن</div>
    <div class="qr-card"><img src="` + qrSrc + `" alt="QR Code"></div>
    <div class="url-wrap">
      <div class="url-icon">&#128279;</div>
      <div class="url-content">
        <div class="url-lbl">رابط المتجر الإلكتروني</div>
        <div class="url-txt">` + storeUrl + `</div>
      </div>
    </div>
    <div class="features">
      <div class="feat"><span class="feat-icon">&#128722;</span><div class="feat-title">تسوق سهل</div><div class="feat-sub">بدون تطبيق</div></div>
      <div class="feat"><span class="feat-icon">&#128274;</span><div class="feat-title">آمن وموثوق</div><div class="feat-sub">بيانات محمية</div></div>
      <div class="feat"><span class="feat-icon">&#9889;</span><div class="feat-title">سريع وفوري</div><div class="feat-sub">طلبك في ثوانٍ</div></div>
    </div>
  </div>

  <div class="footer">
    <span>تسوق آمن وسهل</span><span class="dot"></span>
    <span>بدون تثبيت أي تطبيق</span><span class="dot"></span>
    <span>جاهز في ثوانٍ</span>
  </div>
</div>
<script>
var img=document.querySelector('.qr-card img');
function doPrint(){
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){window.print()});}
  else{window.print();}
}
if(img.complete&&img.naturalWidth>0){doPrint();}
else{img.onload=doPrint;img.onerror=doPrint;setTimeout(doPrint,3500);}
<\/script>
</body>
</html>`);
    win.document.close();
  }

  window.openStoreQR   = openStoreQR;
  window.closeStoreQR  = closeStoreQR;
  window.printStoreQR  = printStoreQR;
})();
</script>
